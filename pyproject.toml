[project]
name = "deep-research"
version = "0.1.0"
description = "Local Deep Research Agent with Web UI"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "tavily-python>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "python-dotenv>=1",
]

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
deep-research = "deep_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deep_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
